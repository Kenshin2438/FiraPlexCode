name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install FontForge
        run: sudo apt-get update && sudo apt-get install -y fontforge python3-fontforge

      - name: Vendor the Nerd Fonts font-patcher
        run: |
          mkdir -p tools
          curl -fL -o /tmp/FontPatcher.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FontPatcher.zip
          unzip -q /tmp/FontPatcher.zip -d tools/font-patcher

      - name: Fetch upstream sources
        run: uv run python scripts/fetch_sources.py

      - name: Stage 1 - merge metadata + graft ligatures
        run: uv run python scripts/build_firaplex.py

      - name: Stage 2 - patch Nerd Font icons into italics
        run: uv run python scripts/patch_italics.py

      - name: Verify
        run: uv run python scripts/verify.py

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION=""
          uv run python scripts/package.py ${VERSION:+--version "$VERSION"}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firaplexcode-dist
          path: dist/*.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME"
